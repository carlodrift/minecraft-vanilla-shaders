name: check

on:
  push:
  pull_request:

jobs:
  check:
    # The tools target macOS (Apple silicon), like the machine everything was tested on.
    runs-on: macos-15
    env:
      MINECRAFT_DIR: ${{ github.workspace }}/build/minecraft
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download the Minecraft 26.3 client from Mojang
        run: python3 tools/fetch.py 26.3

      - name: Vanilla compiles and validates
        run: tools/mcshaders check

      - name: Experiments give their expected result
        run: python3 tools/experiments.py

      - name: Examples pass check
        run: python3 tools/examples.py

      - name: Generated reference is up to date
        run: |
          python3 tools/reference.py
          git diff --exit-code -- reference docs/reference

      - name: Markdown links resolve
        run: python3 tools/check_links.py
