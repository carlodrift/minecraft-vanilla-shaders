name: snapshot watch

# Every week, compare the latest Minecraft snapshot with 26.3 and open an issue for each new snapshot,
# with the report of tools/snapshot_report.py: files, pipelines, and whether experiments and examples
# still get their expected verdict.
on:
  schedule:
    - cron: "0 6 * * 4"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: macos-15
    env:
      MINECRAFT_DIR: ${{ github.workspace }}/build/minecraft
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download 26.3 and the latest snapshot
        id: fetch
        run: |
          python3 tools/fetch.py 26.3 > /dev/null
          echo "version=$(python3 tools/fetch.py latest-snapshot)" >> "$GITHUB_OUTPUT"

      - name: Report
        id: report
        run: |
          if python3 tools/snapshot_report.py 26.3 "${{ steps.fetch.outputs.version }}" > report.md; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
          else
            echo "status=regressions" >> "$GITHUB_OUTPUT"
          fi
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open an issue for a new snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.fetch.outputs.version }}
          STATUS: ${{ steps.report.outputs.status }}
        run: |
          title="Snapshot watch: $VERSION"
          if [ "$STATUS" = "regressions" ]; then title="$title (regressions)"; fi
          if gh issue list --state all --limit 200 --json title --jq '.[].title' | grep -qE "^Snapshot watch: ${VERSION}( |\$)"; then
            echo "Already reported: $VERSION"
          else
            gh issue create --title "$title" --body-file report.md
          fi
